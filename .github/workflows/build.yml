name: Build OnePlus 9R Kernel with KernelSU
on:
  workflow_dispatch: # Запуск вручную кнопкой в Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: oneplus/sm8250_t_13.1_op9r
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git libssl-dev libelf-dev clang lld llvm

      - name: Integrate KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/kona-perf_defconfig

      - name: Setup Clang
        run: |
          git clone --depth=1 https://github.com/llvm/llvm-project.git clang-llvm
          # Можно использовать системный clang для простоты, если ядро не слишком капризное

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="/usr/bin:$PATH"
          make O=out ARCH=arm64 vendor/kona-perf_defconfig
          make -j$(nproc) O=out \
                      ARCH=arm64 \
                      CC=clang \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-OnePlus9R-KSU
          path: out/arch/arm64/boot/Image.gz-dtb
