name: Build OnePlus 9R Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # Используем конкретную версию для стабильности
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          # Убираем параметр ref, чтобы он просто брал текущую ветку
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev clang lld llvm curl git

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev clang lld llvm curl git python2
          # Делаем python2 версией по умолчанию для этого шага
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Integrate KernelSU
        run: |
          # Прямая интеграция без лишних скриптов, если стандартный тупит
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          # Убеждаемся, что в конце Kconfig нет мусора
          sed -i '/drivers\/kernelsu\/Kconfig/d' drivers/Kconfig
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="DxrkFuture"
          export KBUILD_BUILD_HOST="Github-Actions"
          
          # Фикс для ошибки "multiple definition of yylloc" (GCC 10+)
          export HOSTCFLAGS="-fcommon"
          export HOSTCXXFLAGS="-fcommon"

          # Генерируем конфиг
          make O=out ARCH=arm64 vendor/kona-perf_defconfig

          # Основная сборка
          # Мы используем LLVM=1 и LLVM_IAS=1, чтобы избежать вызова /usr/bin/as
          make -j$(nproc) O=out \
                      ARCH=arm64 \
                      LLVM=1 \
                      LLVM_IAS=1 \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      KCFLAGS="-fno-strict-aliasing -fcommon"


      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r ../kernel-ksu-op9r.zip *

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus9R-KernelSU-ZIP
          path: kernel-ksu-op9r.zip
