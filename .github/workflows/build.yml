name: Build OnePlus 9R Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # Используем конкретную версию для стабильности
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: OnePlusOSS/android_kernel_oneplus_sm8250
          ref: oneplus/sm8250_t_13.1_op9r
          fetch-depth: 1
        

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev clang lld llvm curl git

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev clang lld llvm curl git python2
          # Делаем python2 версией по умолчанию для этого шага
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Integrate KernelSU Next
        run: |
          # Прямая интеграция без лишних скриптов, если стандартный тупит
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          # Убеждаемся, что в конце Kconfig нет мусора
          sed -i '/drivers\/kernelsu\/Kconfig/d' drivers/Kconfig
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="DxrkFuture"
          export KBUILD_BUILD_HOST="Github-Actions"

          # 1. РАДИКАЛЬНЫЙ ФИКС БИТЫХ ССЫЛОК (Универсальный)
          # Скрипт проходит по всем Kconfig и комментирует source, если файл не найден физически
          find . -name "Kconfig*" | xargs sed -i 's/^source/source/g' # нормализация
          python3 << EOF
          import os, re
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.startswith("Kconfig"):
                      path = os.path.join(root, file)
                      with open(path, "r") as f:
                          lines = f.readlines()
                      with open(path, "w") as f:
                          for line in lines:
                              match = re.search(r'source "([^"]+)"', line)
                              if match:
                                  src_path = match.group(1)
                                  if not os.path.exists(src_path):
                                      print(f"Commenting out missing: {src_path} in {path}")
                                      f.write(f"# {line}")
                                      continue
                              f.write(line)
          EOF

          # 2. Фиксы драйверов (f2fs и камера)
          sed -i 's/extern inline void wake_up_odiscard_of2fs/void wake_up_odiscard_of2fs/g' fs/f2fs/f2fs.h || true
          
          # 3. Скрипты обертки и флаги
          sed -i 's/allowed = False/allowed = True/g' scripts/gcc-wrapper.py || true
          export HOSTCFLAGS="-fcommon"
          export HOSTCXXFLAGS="-fcommon"

          # 4. Конфигурация
          make O=out ARCH=arm64 vendor/kona-perf_defconfig
          
          # Отключаем WERROR и форсим KSU
          sed -i 's/CONFIG_WERROR=y/CONFIG_WERROR=n/g' out/.config
          echo "CONFIG_KSU=y" >> out/.config

          # 5. Сборка
          make -j$(nproc) O=out \
                      ARCH=arm64 \
                      LLVM=1 \
                      LLVM_IAS=1 \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      KCFLAGS="-w -fno-strict-aliasing -fcommon"


      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r ../kernel-ksu-op9r.zip *

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus9R-KernelSU-ZIP
          path: kernel-ksu-op9r.zip
