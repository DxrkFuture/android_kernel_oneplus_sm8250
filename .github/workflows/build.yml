name: Build OnePlus 9R Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # Используем конкретную версию для стабильности
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: OnePlusOSS/android_kernel_oneplus_sm8250
          ref: oneplus/sm8250_t_13.1_op9r
          fetch-depth: 1
        

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev clang lld llvm curl git

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev clang lld llvm curl git python2
          # Делаем python2 версией по умолчанию для этого шага
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Integrate KernelSU Next
        run: |
          # Прямая интеграция без лишних скриптов, если стандартный тупит
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          # Убеждаемся, что в конце Kconfig нет мусора
          sed -i '/drivers\/kernelsu\/Kconfig/d' drivers/Kconfig
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="DxrkFuture"
          export KBUILD_BUILD_HOST="Github-Actions"

          # 1. МАССОВЫЙ ФИКС отсутствующих компонентов OnePlus
          # Комментируем все строки source, которые ведут в несуществующие папки kernel/sched_assist и kernel/tuning
          sed -i 's/^source "kernel\/sched_assist\/Kconfig"/#source "kernel\/sched_assist\/Kconfig"/' init/Kconfig
          sed -i 's/^source "kernel\/tuning\/Kconfig"/#source "kernel\/tuning\/Kconfig"/' init/Kconfig
          
          # 2. Фиксы драйверов (f2fs и камера), чтобы не падал в середине процесса
          sed -i 's/extern inline void wake_up_odiscard_of2fs/void wake_up_odiscard_of2fs/g' fs/f2fs/f2fs.h || true

          # 3. Исправления скриптов оберток
          sed -i 's/allowed = False/allowed = True/g' scripts/gcc-wrapper.py || true
          export HOSTCFLAGS="-fcommon"
          export HOSTCXXFLAGS="-fcommon"

          # 4. Конфигурация
          # Важно: сначала генерируем конфиг, потом правим его
          make O=out ARCH=arm64 vendor/kona-perf_defconfig
          
          # Отключаем WERROR и включаем KernelSU (если скрипт setup.sh не прописал)
          sed -i 's/CONFIG_WERROR=y/CONFIG_WERROR=n/g' out/.config
          echo "CONFIG_KSU=y" >> out/.config

          # 5. Сборка
          make -j$(nproc) O=out \
                      ARCH=arm64 \
                      LLVM=1 \
                      LLVM_IAS=1 \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      KCFLAGS="-w -fno-strict-aliasing -fcommon"

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r ../kernel-ksu-op9r.zip *

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus9R-KernelSU-ZIP
          path: kernel-ksu-op9r.zip
